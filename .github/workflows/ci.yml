name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    name: 索引可构建且每个技能含 name 与 description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建索引并校验 frontmatter
        run: python scripts/build_index.py
